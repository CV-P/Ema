name: Build Dual EMA Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project folders from mobile uploads
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/dualema/alerts
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          for f in MainActivity ScannerService CrossoverMath TradingViewLinks; do
            cp "${f}.java" "app/src/main/java/com/dualema/alerts/${f}.java"
          done
          cp build.gradle app/build.gradle
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install required Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Name output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk DualEMA_V2_4_Alerts.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DualEMA_V2_4_Alerts_APK
          path: DualEMA_V2_4_Alerts.apk
          if-no-files-found: error
          
