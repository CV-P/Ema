name: Build Dual EMA Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android project folders from mobile uploads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/dualema/alerts
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          for f in MainActivity ScannerService CrossoverMath TradingViewLinks; do
            cp "${f}.java" "app/src/main/java/com/dualema/alerts/${f}.java"
          done
          cp build.gradle app/build.gradle
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runner already has Android command line tools.
      # Do not use android-actions/setup-android@v3: in this environment it
      # fails while trying to install the obsolete SDK package named 'tools'.
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          if [[ -z "$SDKMGR" ]]; then
            echo 'Android sdkmanager was not found on the GitHub runner.' >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMGR" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk DualEMA_V2_4_Alerts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DualEMA_V2_4_Alerts_APK
          path: DualEMA_V2_4_Alerts.apk
          if-no-files-found: error
