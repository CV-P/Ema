name: Build Dual EMA Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install required Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble signed debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Check output and name APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk DualEMA_V2_4_Alerts.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DualEMA_V2_4_Alerts_APK
          path: DualEMA_V2_4_Alerts.apk
          if-no-files-found: error
          retention-days: 30
